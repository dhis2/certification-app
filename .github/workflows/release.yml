---
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      api-release-created: ${{ steps.release.outputs.api--release_created }}
      client-release-created: ${{ steps.release.outputs.client--release_created }}
    steps:
      - name: Create or update release PRs
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  resolve-tags:
    name: Resolve Image Tags
    runs-on: ubuntu-24.04
    needs: [release-please]
    if: needs.release-please.outputs.releases-created == 'true'
    permissions:
      contents: read
    outputs:
      api-version-plain: ${{ steps.tags.outputs.api-version-plain }}
      client-version-plain: ${{ steps.tags.outputs.client-version-plain }}
      api-major-minor: ${{ steps.tags.outputs.api-major-minor }}
      client-major-minor: ${{ steps.tags.outputs.client-major-minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read manifest and resolve versions
        id: tags
        run: |
          set -euo pipefail
          API_VERSION=$(jq -r '.api' .release-please-manifest.json)
          CLIENT_VERSION=$(jq -r '.client' .release-please-manifest.json)

          echo "api-version-plain=${API_VERSION}" >> "$GITHUB_OUTPUT"
          echo "client-version-plain=${CLIENT_VERSION}" >> "$GITHUB_OUTPUT"

          API_MAJOR_MINOR=$(echo "$API_VERSION" | cut -d. -f1-2)
          CLIENT_MAJOR_MINOR=$(echo "$CLIENT_VERSION" | cut -d. -f1-2)
          echo "api-major-minor=v${API_MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          echo "client-major-minor=v${CLIENT_MAJOR_MINOR}" >> "$GITHUB_OUTPUT"

  build-api-staging:
    name: Build API (staging)
    runs-on: ubuntu-24.04
    needs: [resolve-tags]
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      deploy-tag: ${{ steps.pick.outputs.deploy-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=semver,pattern=v{{version}},suffix=-staging,value=${{ needs.resolve-tags.outputs.api-version-plain }}
            type=semver,pattern=v{{major}}.{{minor}},suffix=-staging,value=${{ needs.resolve-tags.outputs.api-version-plain }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: pick
        run: |
          set -euo pipefail
          first="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          tag="${first##*:}"
          echo "deploy-tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./api
          file: ./api/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-staging
          cache-to: type=gha,scope=api-staging,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: cosign sign --yes ${{ env.API_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-api-production:
    name: Build API (production)
    runs-on: ubuntu-24.04
    needs: [resolve-tags]
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      deploy-tag: ${{ steps.pick.outputs.deploy-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=semver,pattern=v{{version}},suffix=-production,value=${{ needs.resolve-tags.outputs.api-version-plain }}
            type=semver,pattern=v{{major}}.{{minor}},suffix=-production,value=${{ needs.resolve-tags.outputs.api-version-plain }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: pick
        run: |
          set -euo pipefail
          first="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          tag="${first##*:}"
          echo "deploy-tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./api
          file: ./api/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-production
          cache-to: type=gha,scope=api-production,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: cosign sign --yes ${{ env.API_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-client-staging:
    name: Build Client (staging)
    runs-on: ubuntu-24.04
    needs: [resolve-tags]
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      deploy-tag: ${{ steps.pick.outputs.deploy-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=semver,pattern=v{{version}},suffix=-staging,value=${{ needs.resolve-tags.outputs.client-version-plain }}
            type=semver,pattern=v{{major}}.{{minor}},suffix=-staging,value=${{ needs.resolve-tags.outputs.client-version-plain }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: pick
        run: |
          set -euo pipefail
          first="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          tag="${first##*:}"
          echo "deploy-tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./client
          file: ./client/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=client-staging
          cache-to: type=gha,scope=client-staging,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: cosign sign --yes ${{ env.CLIENT_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.CLIENT_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-client-production:
    name: Build Client (production)
    runs-on: ubuntu-24.04
    needs: [resolve-tags]
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      deploy-tag: ${{ steps.pick.outputs.deploy-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=semver,pattern=v{{version}},suffix=-production,value=${{ needs.resolve-tags.outputs.client-version-plain }}
            type=semver,pattern=v{{major}}.{{minor}},suffix=-production,value=${{ needs.resolve-tags.outputs.client-version-plain }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: pick
        run: |
          set -euo pipefail
          first="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          tag="${first##*:}"
          echo "deploy-tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./client
          file: ./client/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=client-production
          cache-to: type=gha,scope=client-production,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: cosign sign --yes ${{ env.CLIENT_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.CLIENT_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  scan-release-staging:
    name: Security Scan (staging images)
    runs-on: ubuntu-24.04
    needs: [build-api-staging, build-client-staging]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan API image (Grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.API_IMAGE }}@${{ needs.build-api-staging.outputs.digest }}
          severity-cutoff: high
          fail-build: false
          output-format: table

      - name: Scan Client image (Grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.CLIENT_IMAGE }}@${{ needs.build-client-staging.outputs.digest }}
          severity-cutoff: high
          fail-build: false
          output-format: table

  scan-release-production:
    name: Security Scan (production images)
    runs-on: ubuntu-24.04
    needs: [build-api-production, build-client-production]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan API image (Grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.API_IMAGE }}@${{ needs.build-api-production.outputs.digest }}
          severity-cutoff: high
          fail-build: false
          output-format: table

      - name: Scan Client image (Grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.CLIENT_IMAGE }}@${{ needs.build-client-production.outputs.digest }}
          severity-cutoff: high
          fail-build: false
          output-format: table

  deploy-staging:
    name: Deploy Staging
    needs:
      - resolve-tags
      - build-api-staging
      - build-client-staging
      - scan-release-staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      api-version: ${{ needs.build-api-staging.outputs.deploy-tag }}
      client-version: ${{ needs.build-client-staging.outputs.deploy-tag }}
    secrets: inherit

  e2e-staging:
    name: E2E Tests (Staging)
    runs-on: ubuntu-24.04
    needs: [deploy-staging]
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: ./.github/actions
        with:
          working-directory: client

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against staging
        working-directory: client
        env:
          PLAYWRIGHT_BASE_URL: https://${{ vars.DOMAIN }}
          CI: "true"
        run: npx playwright test --project=chromium

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-staging
          path: client/playwright-report/
          retention-days: 14

  deploy-production:
    name: Deploy Production
    needs:
      - resolve-tags
      - build-api-production
      - build-client-production
      - scan-release-production
      - e2e-staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      api-version: ${{ needs.build-api-production.outputs.deploy-tag }}
      client-version: ${{ needs.build-client-production.outputs.deploy-tag }}
    secrets: inherit

  summarize-releases:
    name: Annotate releases (deployment summary)
    needs:
      - release-please
      - resolve-tags
      - build-api-staging
      - build-client-staging
      - build-api-production
      - build-client-production
      - deploy-production
    if: >-
      always()
      && needs.release-please.outputs.releases-created == 'true'
      && needs.deploy-production.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Append deployment summary to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_STAGING_TAG: ${{ needs.build-api-staging.outputs.deploy-tag }}
          CLIENT_STAGING_TAG: ${{ needs.build-client-staging.outputs.deploy-tag }}
          API_PROD_TAG: ${{ needs.build-api-production.outputs.deploy-tag }}
          CLIENT_PROD_TAG: ${{ needs.build-client-production.outputs.deploy-tag }}
          API_VER: ${{ needs.resolve-tags.outputs.api-version-plain }}
          CLIENT_VER: ${{ needs.resolve-tags.outputs.client-version-plain }}
        run: |
          set -euo pipefail

          NOTES="$(mktemp)"
          ts="$(date -u '+%Y-%m-%dT%H:%MZ')"
          printf '%s\n' \
            "" \
            "### CI deployment summary (${ts})" \
            "" \
            "| Environment | Base URL | API tag | Client tag |" \
            "|-------------|----------|---------|------------|" \
            "| Staging | https://staging.certification.dhis2.org | ${API_STAGING_TAG} | ${CLIENT_STAGING_TAG} |" \
            "| Production | https://certification.dhis2.org | ${API_PROD_TAG} | ${CLIENT_PROD_TAG} |" \
            "" \
            >"${NOTES}"

          try_patch_release() {
            local comp="$1"
            local ver="$2"

            local cands=("${comp}/v${ver}" "${comp}-v${ver}")
            for tag in "${cands[@]}"; do
              if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" &>/dev/null; then
                local merged
                merged="$(mktemp)"
                gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body -q .body >"${merged}"
                printf '\n' >>"${merged}"
                cat "${NOTES}" >>"${merged}"
                gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --notes-file "${merged}"
                printf 'Patched release %s\n' "${tag}"
                return 0
              fi
            done
            printf '::notice::No GitHub Release found for %s v%s (tried %s); skip.\n' \
              "${comp}" "${ver}" "${cands[*]}"
            return 0
          }

          try_patch_release api "${API_VER}"
          try_patch_release client "${CLIENT_VER}"

          {
            echo "## Release deployment summary"
            cat "${NOTES}"
          } >>"${GITHUB_STEP_SUMMARY}"
